# Opens the live site's /health page every hour. /health runs a query on the Aiven
# MySQL database, so the free service always shows recent activity and Aiven does not
# power it off for being idle. If the database is offline anyway, the run fails and
# GitHub e-mails the repository owner, who can power it on in the Aiven console.
# (GitHub pauses scheduled workflows in a public repository after 60 days without
# commits; re-enable it on the Actions tab if that happens.)

name: Keep the database awake

on:
  schedule:
    - cron: "17 * * * *"   # every hour at minute 17, UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database through /health
        # --retry also covers a 503 "database offline" answer from a cold start
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 30 https://pulsecrm-peach.vercel.app/health
