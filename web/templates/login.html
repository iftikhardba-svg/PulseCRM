{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card login-card">
  <h1>Sign in</h1>
  <p class="muted" style="margin: 0 0 8px">PulseCRM is open to registered users. Ask an administrator for an account.</p>
  {% if error %}<div class="flash error" style="margin: 12px 0 0">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="username">User name</label>
    <input type="text" id="username" name="username" value="{{ username }}" autocomplete="username"
           autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <div class="actions"><button class="btn" type="submit">Sign in</button></div>
  </form>
</div>
{% endblock %}
